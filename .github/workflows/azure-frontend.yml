name: Build and deploy frontend to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          NEXT_PUBLIC_API_URL: https://plantplotter-ak-fxabchgjgwesgce4.canadacentral-01.azurewebsites.net/api
        run: npm run build --workspace=plantplotter

      - name: Create standalone deployment package
        run: |
          mkdir -p frontend-deploy

          # Copy standalone output
          cp -r plantplotter/.next/standalone/* frontend-deploy/

          # Use rsync to ensure .next is fully copied
          rsync -a plantplotter/.next/ frontend-deploy/plantplotter/.next/

          # Copy public assets
          cp -r plantplotter/public frontend-deploy/plantplotter/public

          echo "=== Verify ==="
          ls -la frontend-deploy/plantplotter/
          ls -la frontend-deploy/plantplotter/.next/

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: frontend-app
          path: frontend-deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: frontend-app

      - name: Debug downloaded artifact
        run: |
          echo "=== Current directory ==="
          ls -la
          echo "=== plantplotter ==="
          ls -la plantplotter/
          echo "=== plantplotter/.next ==="
          ls -la plantplotter/.next/ 2>/dev/null || echo "MISSING"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'plantplotter-web-ak'
          publish-profile: ${{ secrets.AZURE_FRONTEND_PUBLISH_PROFILE }}
          package: .